name: 기능 제안
description: 새 기능이나 지원 범위 확대를 제안합니다
title: "[제안] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        증권사 API가 바뀐 것을 알리려면 "증권사 API 변경" 양식을 쓰십시오.
        새 증권사 제안은 이 양식에 적습니다.
  - type: dropdown
    id: broker
    attributes:
      label: 대상 증권사
      multiple: true
      options:
        - 한국투자증권(kis)
        - 토스증권(toss)
        - KB증권(kbsec)
        - 새 증권사
        - 증권사와 관계없음
    validations:
      required: true
  - type: input
    id: method
    attributes:
      label: 메서드 이름
      description: ccxt에 같은 기능의 메서드가 있으면 그 이름을 적습니다.
      placeholder: fetchTickers
  - type: textarea
    id: motivation
    attributes:
      label: 필요한 이유
      description: 지금은 무엇을 못 하는지, 이 기능으로 무엇을 하려는지 적습니다.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: 증권사 API 근거
      description: 기능을 다루는 증권사 공식 문서의 주소를 적습니다. 문서를 찾지 못했다면 "확인 못함"이라고 적습니다.
    validations:
      required: true
  - type: dropdown
    id: order-path
    attributes:
      label: 주문 경로 관련 여부
      description: 주문을 내거나 취소하거나 정정하는 기능이면 실계좌에서 시험이 필요합니다.
      options:
        - 주문 경로와 관계없음
        - 주문을 내거나 취소하거나 정정함
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: 직접 구현할 수 있습니까
      options:
        - 직접 PR을 올릴 수 있습니다
        - 도움이 있으면 올릴 수 있습니다
        - 제안만 합니다
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 확인
      options:
        - label: 같은 제안이 이미 있는지 이슈를 검색했습니다.
          required: true
        - label: 앱키, 시크릿, 토큰, 계좌번호를 적지 않았습니다.
          required: true
