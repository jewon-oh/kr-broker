# 의존성(npm, Python)과 GitHub Actions를 주 1회 점검합니다.
# 새 버전이 나온 지 7일이 지나야 갱신 PR을 만듭니다(cooldown). 보안 갱신은 이 대기 없이 바로 올라옵니다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # @types/node는 지원하는 가장 낮은 Node.js(22)에 맞춥니다. 메이저 판을 올리면 Node.js 22에 없는 API를 써도 타입 검사가 잡지 못합니다.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # python/pyproject.toml 과 CI 잠금 파일(python/requirements 의 .in → .txt)을 함께 올린다. 잠금 파일은 uv pip compile --universal 로 만들었다.
  # pip 생태계는 .in 을 pip-compile 로 다시 만들어 한 Python 판으로만 풀기 때문에 uv 생태계를 쓴다.
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
