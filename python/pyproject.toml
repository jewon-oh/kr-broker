[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kr-broker"
version = "0.5.0"
description = "한국투자증권·토스증권 Open API 를 ccxt 방식으로 부르는 Python 라이브러리"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["requests>=2.33.0", "aiohttp>=3.14.3", "cryptography>=50.0.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["kr_broker"]
# 테스트는 저장소의 ts/src/test/static/ 를 읽으므로 휠에 싣지 않는다.
exclude = ["kr_broker/test"]

[tool.pytest.ini_options]
testpaths = ["kr_broker/test"]
# 비동기 판에서 await 를 빠뜨리면 코루틴이 돌지 않고 경고만 남는다. 경고를 실패로 본다.
filterwarnings = ["error::RuntimeWarning", "error::pytest.PytestUnraisableExceptionWarning"]

# 오류 수는 ../scripts/check-python-types.mjs 가 기준선(pyright-baseline.json)과 비교한다. 테스트도 공개 API 를 부르므로 함께 본다.
[tool.pyright]
include = ["kr_broker"]
typeCheckingMode = "basic"
# 지원하는 가장 낮은 버전으로 본다. 3.11 이후에 생긴 표준 라이브러리 API 를 쓰면 오류다.
pythonVersion = "3.10"
